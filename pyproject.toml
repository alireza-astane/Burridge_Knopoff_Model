[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bksoc"
version = "0.1.0"
description = "Burridge-Knopoff earthquake model, sandpile models, and the mapping between them"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "numba", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["bksoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long statistical tests (deselect with -m 'not slow')"]
